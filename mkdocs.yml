site_name: ATC Capacity & Analytics
site_description: Documentación técnica del sistema de cálculo de capacidad y análisis predictivo.
theme:
  name: material
  favicon: assets/favicon.png
  logo: assets/logo.png
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/name:pymdownx.arithmatex.fence_mathjax_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_category_heading: true
            show_root_heading: true

nav:
  - 🏠 Inicio: index.md
  - 📚 Manuales del Sistema:
    - ✈️ Manual Aeronáutico (Principiantes): aeronautical_guide.md
    - 📙 Manual de Usuario ATC: user_manual.md
    - 📘 Manual Técnico Maestro: tech_manual.md
    - 🤖 Manual de Agentes RAC 14: agents_rac14.md
  - 🏛️ Arquitectura del Sistema:
    - 📐 Project Blueprints (UML): project_blueprints.md
    - ⚙️ Conceptos Hexagonales: architecture.md
    - 🧩 Capa de Dominio: domain.md
    - 🧠 Capa de Aplicación: application.md
    - 🏗️ Capa de Infraestructura: infrastructure.md
    - 💻 Interfaz Frontend: frontend.md
  - 🔬 Ciencia de Datos y Core:
    - 📏 Fundamentos Teóricos: theoretical_basis.md
    - 📝 Marco Metodológico: methodology.md
    - 📈 Análisis y Resultados: results_analysis.md
    - 🧪 Demostraciones: demostraciones.md
  - 📄 Código y Referencias:
    - 📋 Requerimientos (RF): requirements.md
    - 🔍 Guía del Código: codebase_guide.md
    - 📚 Referencia Técnica (API): reference.md
  - 📖 Glosario Técnico: technical_glossary.md
